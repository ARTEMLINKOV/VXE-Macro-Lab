name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/VxeMacroLab/VxeMacroLab.csproj
      - name: Build
        run: dotnet build src/VxeMacroLab/VxeMacroLab.csproj --configuration Release --no-restore
