name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/VxeMacroLab/VxeMacroLab.csproj
      - name: Build
        run: dotnet build src/VxeMacroLab/VxeMacroLab.csproj --configuration Release --no-restore
      - name: Publish single-file Windows x64 executable
        run: dotnet publish src/VxeMacroLab/VxeMacroLab.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VXE-Macro-Lab-SnapTap-win-x64
          path: src/VxeMacroLab/bin/Release/net8.0-windows/win-x64/publish/VxeMacroLab.exe
          if-no-files-found: error
          retention-days: 14
