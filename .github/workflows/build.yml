name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - feature/keyboard-target-selection

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/VxeMacroLab/VxeMacroLab.csproj

      - name: Build
        run: dotnet build src/VxeMacroLab/VxeMacroLab.csproj --configuration Release --no-restore

      - name: Publish EXE
        run: dotnet publish src/VxeMacroLab/VxeMacroLab.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VXE-Macro-Lab-win-x64
          path: publish
